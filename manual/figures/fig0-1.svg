<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 200' width='700' height='200'><defs><marker id='arr' markerWidth='10' markerHeight='10' refX='8' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#334155'/></marker><marker id='arrA' markerWidth='10' markerHeight='10' refX='8' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#E63946'/></marker></defs><rect width='700' height='200' fill='white'/><rect x='60' y='30' width='220' height='80' rx='6' fill='#EFF6FF' stroke='#111827' stroke-width='1.6'/><text x='170.0' y='69.0' text-anchor='middle' font-size='13' font-weight='700' fill='#111827' font-family='Helvetica, Arial, sans-serif'>Red Teamer</text><text x='170.0' y='83.0' text-anchor='middle' font-size='10' fill='#334155' font-family='Helvetica, Arial, sans-serif'>finds the failure</text><rect x='420' y='30' width='220' height='80' rx='6' fill='#F0FDF4' stroke='#111827' stroke-width='1.6'/><text x='530.0' y='69.0' text-anchor='middle' font-size='13' font-weight='700' fill='#111827' font-family='Helvetica, Arial, sans-serif'>Researcher</text><text x='530.0' y='83.0' text-anchor='middle' font-size='10' fill='#334155' font-family='Helvetica, Arial, sans-serif'>makes it a number, a method,</text><text x='530' y='100' text-anchor='middle' font-size='10' fill='#334155' font-family='Helvetica, Arial, sans-serif'>a published check</text><circle cx='350' cy='70' r='30' fill='#FEF2F2' stroke='#E63946' stroke-width='1.6'/><text x='350' y='67' text-anchor='middle' font-size='11' fill='#111827' font-weight='700' font-family='Helvetica, Arial, sans-serif'>both</text><text x='350' y='81' text-anchor='middle' font-size='10' fill='#111827' font-family='Helvetica, Arial, sans-serif'>= you</text><rect x='60' y='140' width='580' height='40' rx='6' fill='#111827'/><text x='350' y='165' text-anchor='middle' font-size='10.5' fill='white' font-style='italic' font-family='Helvetica, Arial, sans-serif'>The check is the product. If you cannot rerun the failure, you have not found it, you have had an opinion.</text><line x1='170' y1='112' x2='170.0' y2='129.0' stroke='#334155' stroke-width='1.8'/><polygon points='170,138 174.5,129.0 165.5,129.0' fill='#334155'/><line x1='530' y1='112' x2='530.0' y2='129.0' stroke='#334155' stroke-width='1.8'/><polygon points='530,138 534.5,129.0 525.5,129.0' fill='#334155'/><text x='350' y='125' text-anchor='middle' font-size='11' fill='#E63946' font-weight='700' font-family='Helvetica, Arial, sans-serif'>I build the check, not the claim.</text></svg>